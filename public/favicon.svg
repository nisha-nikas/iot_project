<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Subtle Circuit Grid Accents -->
  <path d="M24 40 h20 v20 M104 88 h-20 v-20 M40 104 v-16 M88 24 v16" 
        stroke="rgba(255,255,255,0.2)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="44" cy="60" r="3" fill="rgba(255,255,255,0.4)" />
  <circle cx="84" cy="68" r="3" fill="rgba(255,255,255,0.4)" />

  <!-- Outer Sensor Orbital Ring -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-dasharray="6 6" />
  <circle cx="64" cy="64" r="32" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="140 60" filter="url(#glow)" />

  <!-- Central Microchip & Super Girls Emblem -->
  <rect x="46" y="46" width="36" height="36" rx="8" fill="#ffffff" />
  
  <!-- Stylized Lightning / IoT Pulse -->
  <path d="M66 50 L56 65 L64 65 L62 78 L72 63 L64 63 Z" fill="#4f46e5" />

  <!-- Glowing Live Node Dot -->
  <circle cx="64" cy="24" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="96" cy="64" r="4.5" fill="#10b981" filter="url(#glow)" />
  <circle cx="64" cy="104" r="4.5" fill="#f59e0b" filter="url(#glow)" />
</svg>
